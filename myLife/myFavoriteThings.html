<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Travel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #ddfaf7;
    }

    .page {
      display: block; /* 기본적으로 숨김 */
    }

    .page.active {
      display: grid;
      grid-template-columns: repeat(5, 120px); /* 가로 5칸 */
      grid-template-rows: repeat(3, 30px);     /* 세로 8칸 */
      gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }

    .box {
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ddfaf7;
      font-size: 11px;
    }

    .box a {
      text-decoration: none;
      color: #0066cc;
      font-weight: bold;
    }

    .box a:hover {
      color: #ff3366;
      text-decoration: underline;
    }

    .nav-buttons {
      margin-top: 20px;
    }

    .nav-buttons button {
      border: none;          /* 테두리 제거 */
      background: none;      /* 배경 제거 */
      font-size: 11px;       /* 글자 크기 */
      cursor: pointer;
      margin: 0 5px;
    }
    .nav-buttons button:hover {
      color: #ff3366;        /* 마우스 올렸을 때 색상 */
    }
  </style>
</head>
